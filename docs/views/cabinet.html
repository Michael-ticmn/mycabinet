<section>
  <div class="cabinet-toolbar">
    <input type="search" id="cabinet-search" placeholder="Search producer, expression, region…" autocomplete="off" />
    <div class="filter-chips" id="cabinet-filters" role="tablist" aria-label="Filter by category">
      <button class="chip active" data-category-filter="all">All</button>
      <button class="chip" data-category-filter="whiskey">Whiskey</button>
      <button class="chip" data-category-filter="agave">Agave</button>
      <button class="chip" data-category-filter="rum">Rum</button>
      <button class="chip" data-category-filter="brandy">Brandy</button>
      <button class="chip" data-category-filter="other">Other</button>
    </div>
    <select id="cabinet-sort" aria-label="Sort">
      <option value="recent">Recently added</option>
      <option value="producer">Producer A–Z</option>
      <option value="age">Age statement (oldest)</option>
      <option value="age_youngest">Age statement (youngest)</option>
      <option value="proof">Proof (highest)</option>
      <option value="peak_end">Peak window end</option>
    </select>
    <div class="view-toggle" id="cabinet-view-toggle" role="group" aria-label="Layout">
      <button type="button" class="view-toggle-btn" data-view="list" aria-label="List view" title="List view">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                d="M5 7 H19 M5 12 H19 M5 17 H19" />
        </svg>
      </button>
      <button type="button" class="view-toggle-btn" data-view="card" aria-label="Card view" title="Card view">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <rect x="4" y="4" width="7" height="7" rx="1.2" />
            <rect x="13" y="4" width="7" height="7" rx="1.2" />
            <rect x="4" y="13" width="7" height="7" rx="1.2" />
            <rect x="13" y="13" width="7" height="7" rx="1.2" />
          </g>
        </svg>
      </button>
    </div>
  </div>
  <p class="muted" id="cabinet-count" hidden></p>
  <div id="cabinet-grid" class="grid"></div>
</section>
